name: travel

x-base-env: &base-env
  SPRING_PROFILES_ACTIVE: docker
  SPRING_CLOUD_NACOS_CONFIG_ENABLED: "false"
  SPRING_CLOUD_NACOS_DISCOVERY_ENABLED: "false"
  SPRING_CLOUD_SENTINEL_ENABLED: "false"
  SEATA_ENABLED: "false"

x-service-env: &service-env
  <<: *base-env
  SERVER_SERVLET_CONTEXT_PATH: /api
  SPRING_SQL_INIT_MODE: never
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-travel_website}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
  SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-root}
  SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-change-me}
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me}
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_PORT: "5672"
  SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-admin}
  SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-change-me}
  SPRING_RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VHOST:-/}

services:
  mysql:
    image: mysql:8.0
    container_name: travel-mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_DATABASE: ${DB_NAME:-travel_website}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../backend/attraction-service/src/main/resources/db/init_complete.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - travel-network

  redis:
    image: redis:7-alpine
    container_name: travel-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-change-me}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-change-me} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - travel-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: travel-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change-me}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - travel-network

  user-service:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      args:
        MODULE_NAME: user-service
        APP_PORT: 8091
        HEALTH_PATH: /api/actuator/health
    container_name: travel-user-service
    environment:
      <<: *service-env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8091:8091"
    restart: unless-stopped
    networks:
      - travel-network

  attraction-service:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      args:
        MODULE_NAME: attraction-service
        APP_PORT: 8092
        HEALTH_PATH: /api/actuator/health
    container_name: travel-attraction-service
    environment:
      <<: *service-env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8092:8092"
    restart: unless-stopped
    networks:
      - travel-network

  route-service:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      args:
        MODULE_NAME: route-service
        APP_PORT: 8093
        HEALTH_PATH: /api/actuator/health
    container_name: travel-route-service
    environment:
      <<: *service-env
      XXL_JOB_ENABLED: "false"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      attraction-service:
        condition: service_healthy
    ports:
      - "8093:8093"
    restart: unless-stopped
    networks:
      - travel-network

  collection-service:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      args:
        MODULE_NAME: collection-service
        APP_PORT: 8094
        HEALTH_PATH: /api/actuator/health
    container_name: travel-collection-service
    environment:
      <<: *service-env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_healthy
      route-service:
        condition: service_healthy
    ports:
      - "8094:8094"
    restart: unless-stopped
    networks:
      - travel-network

  file-service:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      args:
        MODULE_NAME: file-service
        APP_PORT: 8095
        HEALTH_PATH: /api/actuator/health
    container_name: travel-file-service
    environment:
      <<: *service-env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8095:8095"
    restart: unless-stopped
    networks:
      - travel-network

  gateway:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      args:
        MODULE_NAME: gateway
        APP_PORT: 8090
        HEALTH_PATH: /actuator/health
    container_name: travel-gateway
    environment:
      <<: *base-env
    depends_on:
      user-service:
        condition: service_healthy
      attraction-service:
        condition: service_healthy
      route-service:
        condition: service_healthy
      collection-service:
        condition: service_healthy
      file-service:
        condition: service_healthy
    ports:
      - "8090:8090"
    restart: unless-stopped
    networks:
      - travel-network

  web:
    build:
      context: ..
      dockerfile: deploy/docker/frontend.Dockerfile
    container_name: travel-web
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - travel-network

volumes:
  mysql_data:
  redis_data:

networks:
  travel-network:
    driver: bridge
