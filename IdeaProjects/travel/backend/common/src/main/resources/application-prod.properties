# ===========================================
# 鐢熶骇鐜閰嶇疆
# ===========================================

# 搴旂敤鍚嶇О

# ===========================================
# 鏁版嵁搴撻厤缃?(鐢熶骇鐜)
# ===========================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:travel_website}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&useSSL=true&allowPublicKeyRetrieval=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 鏁版嵁搴撹繛鎺ユ睜閰嶇疆 (鐢熶骇鐜浼樺寲)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.leak-detection-threshold=60000

# ===========================================
# MyBatis-Plus閰嶇疆
# ===========================================
mybatis-plus.mapper-locations=classpath:mappers/**/*.xml
mybatis-plus.type-aliases-package=travel.entity
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl

# ===========================================
# Redis閰嶇疆 (鐢熶骇鐜)
# ===========================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DB:0}
spring.data.redis.timeout=5000ms

# Redis杩炴帴姹犻厤缃?(鐢熶骇鐜浼樺寲)
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=5
spring.data.redis.lettuce.pool.max-wait=5000ms
spring.data.redis.lettuce.shutdown-timeout=200ms
mq.status-persistence.enabled=${MQ_STATUS_PERSISTENCE_ENABLED:false}

# ===========================================
# 鏈嶅姟鍣ㄩ厤缃?(鐢熶骇鐜)
# ===========================================
server.servlet.context-path=/api
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.max-connections=10000
server.tomcat.accept-count=100
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024

# ===========================================
# 鏃ュ織閰嶇疆 (鐢熶骇鐜)
# ===========================================
logging.level.root=WARN
logging.level.travel=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.mybatis=WARN
logging.file.name=${LOG_PATH:/var/log/travel}/app.log
logging.file.max-size=100MB
logging.file.max-history=30
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n

# ===========================================
# 瀹氭椂浠诲姟閰嶇疆
# ===========================================
spring.task.scheduling.pool.size=10
spring.task.scheduling.thread-name-prefix=scheduling-

# ===========================================
# 鍋ュ悍妫€鏌ラ厤缃?
# ===========================================
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.show-components=always
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# ===========================================
# Actuator淇℃伅
# ===========================================
info.app.name=鏅烘収鏃呮父API
info.app.description=鏅烘収鏃呮父绯荤粺鍚庣鏈嶅姟
info.app.version=@project.version@
info.app.encoding=@project.build.sourceEncoding@
info.app.java.version=@java.version@

# ===========================================
# 瀹夊叏閰嶇疆 (鐢熶骇鐜)
# ===========================================
# JWT閰嶇疆
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# 闄愭祦閰嶇疆
rate.limit.enabled=true
rate.limit.requests-per-minute=1000

# ===========================================
# 鏂囦欢涓婁紶閰嶇疆
# ===========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ===========================================
# 缂撳瓨閰嶇疆
# ===========================================
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false

