
# 鏁版嵁搴撻厤缃?
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:travel_website}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 鏁版嵁搴撹繛鎺ユ睜閰嶇疆
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# MyBatis-Plus閰嶇疆
mybatis-plus.mapper-locations=classpath:mappers/**/*.xml
mybatis-plus.type-aliases-package=travel.entity
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# Redis閰嶇疆
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DB:3}

# Redis杩炴帴姹犻厤缃?
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=3000ms
spring.data.redis.lettuce.shutdown-timeout=100ms
redisson.lock.wait-time-seconds=${REDISSON_LOCK_WAIT_TIME_SECONDS:3}
redisson.lock.lease-time-seconds=${REDISSON_LOCK_LEASE_TIME_SECONDS:15}
redisson.lock.wait-time-seconds=${REDISSON_LOCK_WAIT_TIME_SECONDS:3}
redisson.lock.lease-time-seconds=${REDISSON_LOCK_LEASE_TIME_SECONDS:15}

# 高德路径规划采用独立的有限超时，失败后由业务层回退到本地估算。
amap.route.connect-timeout-ms=${AMAP_ROUTE_CONNECT_TIMEOUT_MS:3000}
amap.route.read-timeout-ms=${AMAP_ROUTE_READ_TIMEOUT_MS:5000}

# OpenFeign 外部服务调用边界；默认值为有限正数，按部署环境显式覆盖。
spring.cloud.openfeign.client.config.default.connectTimeout=${FEIGN_CONNECT_TIMEOUT_MS:1000}
spring.cloud.openfeign.client.config.default.readTimeout=${FEIGN_READ_TIMEOUT_MS:3000}

# 第三方 HTTP 响应体上限，防止异常响应占满业务 JVM 堆内存。
travel.external.max-response-bytes=${EXTERNAL_MAX_RESPONSE_BYTES:1048576}

# 第三方同步调用并发隔离，避免单个供应商故障耗尽业务线程。
travel.external.acquire-timeout-ms=${EXTERNAL_ACQUIRE_TIMEOUT_MS:50}
travel.external.amap.max-concurrent=${AMAP_MAX_CONCURRENT_CALLS:32}
travel.external.baidu-ai.max-concurrent=${BAIDU_AI_MAX_CONCURRENT_CALLS:8}
travel.external.openai.max-concurrent=${OPENAI_MAX_CONCURRENT_CALLS:8}

# 鏁版嵁搴撳垵濮嬪寲锛堥娆″惎鍔ㄦ椂鑷姩寤鸿〃鍜岀储寮曪級
spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.sql.init.schema-locations=classpath:db/init_complete.sql
spring.sql.init.continue-on-error=true

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:<CLOUD_HOST_PLACEHOLDER>}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.requested-heartbeat=30s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.listener.simple.concurrency=3
spring.rabbitmq.listener.simple.max-concurrency=10
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=1000
spring.rabbitmq.template.retry.max-attempts=3
spring.rabbitmq.template.retry.max-interval=5000
spring.rabbitmq.template.retry.multiplier=2
spring.rabbitmq.template.mandatory=true
mq.status-persistence.enabled=${MQ_STATUS_PERSISTENCE_ENABLED:false}
mq.reliable-notification.topology.enabled=${MQ_RELIABLE_NOTIFICATION_TOPOLOGY_ENABLED:false}
mq.reliable-notification.producer.enabled=${MQ_RELIABLE_NOTIFICATION_PRODUCER_ENABLED:false}
mq.reliable-notification.consumer.enabled=${MQ_RELIABLE_NOTIFICATION_CONSUMER_ENABLED:false}
mq.reliable-notification.confirm-timeout-ms=${MQ_RELIABLE_NOTIFICATION_CONFIRM_TIMEOUT_MS:5000}
mq.reliable-notification.max-retries=${MQ_RELIABLE_NOTIFICATION_MAX_RETRIES:3}
mq.reliable-notification.idempotency.processing-ttl-seconds=${MQ_RELIABLE_NOTIFICATION_PROCESSING_TTL_SECONDS:300}
mq.reliable-notification.idempotency.completed-ttl-seconds=${MQ_RELIABLE_NOTIFICATION_COMPLETED_TTL_SECONDS:259200}
mq.status-compensation.enabled=${MQ_STATUS_COMPENSATION_ENABLED:false}
mq.status-compensation.fixed-delay-ms=${MQ_STATUS_COMPENSATION_FIXED_DELAY_MS:30000}
mq.status-compensation.batch-size=${MQ_STATUS_COMPENSATION_BATCH_SIZE:50}
mq.status-compensation.max-attempts=${MQ_STATUS_COMPENSATION_MAX_ATTEMPTS:3}
mq.status-compensation.stale-after-seconds=${MQ_STATUS_COMPENSATION_STALE_AFTER_SECONDS:60}
mq.status-compensation.retry-delay-seconds=${MQ_STATUS_COMPENSATION_RETRY_DELAY_SECONDS:30}

# 鏈嶅姟鍣ㄩ厤缃?
server.servlet.context-path=/api

# 鏃ュ織閰嶇疆
logging.level.travel=debug
logging.level.org.springframework.web=debug
logging.level.travel.exception=debug

# 瀹氭椂浠诲姟閰嶇疆
spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=scheduling-
attraction.bloom.expected-insertions=${ATTRACTION_BLOOM_EXPECTED_INSERTIONS:10000}
attraction.bloom.false-positive-rate=${ATTRACTION_BLOOM_FALSE_POSITIVE_RATE:0.01}
attraction.bloom.refresh-cron=${ATTRACTION_BLOOM_REFRESH_CRON:0 0/30 * * * ?}
attraction.bloom.expected-insertions=${ATTRACTION_BLOOM_EXPECTED_INSERTIONS:10000}
attraction.bloom.false-positive-rate=${ATTRACTION_BLOOM_FALSE_POSITIVE_RATE:0.01}
attraction.bloom.refresh-cron=${ATTRACTION_BLOOM_REFRESH_CRON:0 0/30 * * * ?}

# 楂樺痉鍦板浘閰嶇疆
amap.api-key=${AMAP_API_KEY:}
amap.api-url=https://restapi.amap.com/v3

# AI Configuration - Baidu AI
ai.baidu.app-id=${BAIDU_APP_ID:}
ai.baidu.api-key=${BAIDU_API_KEY:}
ai.baidu.secret-key=${BAIDU_SECRET_KEY:}

# AI Configuration - Alibaba Qwen (閫氫箟鍗冮棶)
ai.qwen.api-key=${QWEN_API_KEY:}
ai.qwen.model=qwen-plus
ai.qwen.enabled=true
ai.qwen.temperature=0.8
ai.qwen.max-tokens=2000

# JWT Configuration
jwt.secret=${JWT_SECRET:}
