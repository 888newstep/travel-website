
# 数据库配置
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/travel_website?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 数据库连接池配置
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# MyBatis-Plus配置
mybatis-plus.mapper-locations=classpath:mappers/**/*.xml
mybatis-plus.type-aliases-package=travel.entity
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# Redis配置
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=0

# Redis连接池配置
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=3000ms
spring.data.redis.lettuce.shutdown-timeout=100ms

# 数据库初始化（首次启动时自动建表和索引）
spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.sql.init.schema-locations=classpath:db/init_complete.sql
spring.sql.init.continue-on-error=true

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.listener.simple.concurrency=3
spring.rabbitmq.listener.simple.max-concurrency=10
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=1000
spring.rabbitmq.template.retry.max-attempts=3

# 服务器配置
server.servlet.context-path=/api

# 日志配置
logging.level.travel=debug
logging.level.org.springframework.web=debug
logging.level.travel.exception=debug

# 定时任务配置
spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=scheduling-

# 高德地图配置
amap.api-key=${AMAP_API_KEY:}
amap.api-url=https://restapi.amap.com/v3

# AI Configuration - Baidu AI
ai.baidu.app-id=${BAIDU_APP_ID:}
ai.baidu.api-key=${BAIDU_API_KEY:}
ai.baidu.secret-key=${BAIDU_SECRET_KEY:}

# AI Configuration - Alibaba Qwen (通义千问)
ai.qwen.api-key=${QWEN_API_KEY:}
ai.qwen.model=qwen-plus
ai.qwen.enabled=true
ai.qwen.temperature=0.8
ai.qwen.max-tokens=2000
