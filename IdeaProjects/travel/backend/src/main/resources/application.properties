spring.application.name=travel

# 数据库配置
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/travel_website?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Axiao151888+
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 数据库连接池配置
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# MyBatis-Plus配置
mybatis-plus.mapper-locations=classpath:mappers/**/*.xml
mybatis-plus.type-aliases-package=org.example.travel.entity
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0
# Redis配置0

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=Axiao151888+
spring.data.redis.database=0

# Redis连接池配置
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=3000ms
spring.data.redis.lettuce.shutdown-timeout=100ms

# 服务器配置
server.port=8080
server.servlet.context-path=/api

# 日志配置
logging.level.org.example.travel=debug
logging.level.org.springframework.web=debug
logging.level.org.example.travel.exception=debug

# 定时任务配置
spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=scheduling-



