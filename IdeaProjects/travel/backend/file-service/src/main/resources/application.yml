mybatis-plus:
  mapper-locations: classpath:mappers/**/*.xml
  type-aliases-package: travel.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    travel: debug
    org.springframework.web: debug
    travel.exception: debug