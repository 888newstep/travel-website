spring:
  cloud:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: "${SPRING_DATA_REDIS_PASSWORD:}"
    discovery:
      client:
        simple:
          instances:
            collection-service:
              - uri: http://collection-service:8094/api
              - uri: http://collection-service-2:8096/api
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: auth-limited
          uri: http://user-service:8091/api
          predicates:
            - Path=/api/users/login,/api/users/register,/api/users/captcha
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 5
                key-resolver: "#{@clientIpKeyResolver}"
        - id: user-service
          uri: http://user-service:8091/api
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1
        - id: attraction-service
          uri: http://attraction-service:8092/api
          predicates:
            - Path=/api/attractions/**, /api/cities/**, /api/restaurants/**, /api/realtime-status/**
          filters:
            - StripPrefix=1
        - id: route-service
          uri: http://route-service:8093/api
          predicates:
            - Path=/api/routes/**, /api/route-optimization/**, /api/ai/**
          filters:
            - StripPrefix=1
        - id: collection-service
          uri: lb://collection-service
          predicates:
            - Path=/api/v1/route-collections/**, /api/route-comments/**, /api/travel-notes/**, /api/feedback/**, /api/v1/notifications/**, /api/v1/user/stats/**, /api/route-share/**
          filters:
            - StripPrefix=1
        - id: file-service
          uri: http://file-service:8095/api
          predicates:
            - Path=/api/file/**, /api/resource/**, /api/resource-file/**
          filters:
            - StripPrefix=1
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: "#{@clientIpKeyResolver}"
