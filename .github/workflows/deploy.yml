# ============================================
# travel — CD 手动部署（GitHub Actions self-hosted runner → 腾讯云）
# ============================================
# 设计决策：
#   1. 只用 workflow_dispatch 手动触发——travel-stack 与 newagent/novel-agent
#      systemd 三方互斥，自动重启会强停正在运行的其他项目。
#   2. self-hosted runner 安装在云服务器上：安全组只放行 Tailscale（公网 22 不通），
#      托管 runner 无法 SSH 进来；self-hosted 在服务器本地直接执行部署，无需 SSH 与私钥。
#      安全性成立前提：本 workflow 仅有 workflow_dispatch 触发（fork PR 无法执行）。
#   3. 对准云端真实形态：裸 jar + systemd（travel-stack.target，5 服务）。
#   4. 失败自动回滚（deploy.sh 内置备份与回滚逻辑）。
#
# 前置：服务器已安装并注册 self-hosted runner（labels: deploy, self-hosted）。
# 服务器需能访问 github.com（下载 actions runner 与 Maven 依赖；走服务器现有代理/直连均可）。

name: CD Deploy

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 部署原因（记入运行日志）
        required: false
        default: manual deploy

concurrency:
  group: cd-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy on Cloud VM
    runs-on: [self-hosted, deploy]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 服务器自带 JDK 21 + Maven 3.6.3（release=17 目标兼容），
      # actions/setup-java 需从 adoptium 下载 JDK，国内服务器不可达，故不使用。

      - name: Build service jars
        working-directory: backend
        run: >
          mvn -B -pl gateway,user-service,attraction-service,route-service,collection-service
          -am package -DskipTests

      - name: Collect jars
        run: |
          mkdir -p staging
          for mod in gateway user-service attraction-service route-service collection-service; do
            cp backend/${mod}/target/${mod}-*.jar staging/ 2>/dev/null || \
              { echo "::error::缺少 ${mod} 的 jar"; exit 1; }
          done
          ls -lh staging/

      - name: Deploy with health check and rollback
        run: |
          chmod +x deploy/deploy.sh
          ./deploy/deploy.sh "$(pwd)/staging" "${DEPLOY_PATH:-/home/ubuntu/travel}"
          echo "部署原因: ${{ github.event.inputs.reason }}"

      - name: Cleanup staging
        if: always()
        run: rm -rf staging
